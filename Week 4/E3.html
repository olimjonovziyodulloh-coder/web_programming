<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E3 — Live To-Do List</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:30px;color:#212529}
h1{text-align:center} .exercise{max-width:520px;margin:30px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{margin-top:0;color:#0f766e}.box{padding:18px;border:2px solid #0f766e;border-radius:10px;margin-top:15px}
button{padding:10px 18px;border:0;border-radius:8px;background:#0f766e;color:white;cursor:pointer}
input{padding:10px;border:1px solid #aaa;border-radius:8px;font-size:16px}
#count{font-size:32px;font-weight:bold;text-align:center}.dark{background:#1a2340!important;color:white!important}
.card{padding:24px;border-radius:16px;width:260px;background:#f0f4ff;border:2px solid #c8d4f0;text-align:center;margin:auto}
.avatar{width:70px;height:70px;border-radius:50%;background:#1a56db;color:white;display:inline-flex;align-items:center;justify-content:center;font-size:32px}
li{list-style:none;padding:10px;margin:6px 0;background:#f0f4ff;border-radius:8px;display:flex;justify-content:space-between}
ul{padding:0}.del{background:#dc2626;padding:5px 10px}.student{padding:10px;margin:6px 0;background:#f0f4ff;border-radius:8px}
mark{background:#f7df1e}
</style>
</head>
<body>
<h1>E3 — Live To-Do List</h1>
<input id="todo" placeholder="Add a task...">
<button id="add">+ Add</button>
<ul id="list"></ul><p id="empty">No tasks yet! Add one above.</p>
<script>
const input=document.querySelector('#todo');
const add=document.querySelector('#add');
const list=document.querySelector('#list');
const empty=document.querySelector('#empty');
function update(){empty.style.display=list.children.length?'none':'block';}
function addTask(){
  const text=input.value.trim();
  if(!text)return;
  const li=document.createElement('li');
  const span=document.createElement('span');
  span.textContent=text;
  const del=document.createElement('button');
  del.textContent='✕';del.className='del';
  li.appendChild(span);li.appendChild(del);list.appendChild(li);
  input.value='';update();
}
add.addEventListener('click',addTask);
input.addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
list.addEventListener('click',e=>{
  if(e.target.classList.contains('del')){e.target.closest('li').remove();update();}
});
update();
</script>
</body>
</html>
