<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REST Countries API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; background: #f0f5f1; }
    main { background: white; padding: 28px; border-radius: 12px; }
    input, button { padding: 10px; }
    button { cursor: pointer; background: #28734b; color: white; border: 0; border-radius: 6px; }
    img { width: 180px; border: 1px solid #ddd; }
    #country { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>REST Countries API</h1>
    <p>Search for a country, for example: Uzbekistan.</p>
    <input id="countryName" value="Uzbekistan" aria-label="Country name">
    <button onclick="getCountry()">Search</button>
    <div id="country">Country information will appear here.</div>
  </main>
  <script>
    async function getCountry() {
      const name = document.getElementById("countryName").value.trim();
      const output = document.getElementById("country");
      if (!name) {
        output.textContent = "Please enter a country name.";
        return;
      }
      output.textContent = "Loading...";
      try {
        const response = await fetch("https://restcountries.com/v3.1/name/" + encodeURIComponent(name) + "?fields=name,capital,region,population,flags,currencies");
        if (!response.ok) throw new Error("Country not found. Check the spelling.");
        const countries = await response.json();
        const country = countries[0];
        output.innerHTML = "";
        const flag = document.createElement("img");
        flag.src = country.flags.png;
        flag.alt = country.name.common + " flag";
        const title = document.createElement("h2");
        title.textContent = country.name.common;
        const capital = document.createElement("p");
        capital.textContent = "Capital: " + ((country.capital || ["Unknown"])[0]);
        const region = document.createElement("p");
        region.textContent = "Region: " + country.region;
        const population = document.createElement("p");
        population.textContent = "Population: " + country.population.toLocaleString();
        output.append(flag, title, capital, region, population);
      } catch (error) {
        output.textContent = "Error: " + error.message;
      }
    }
    document.getElementById("countryName").addEventListener("keydown", event => {
      if (event.key === "Enter") getCountry();
    });
  </script>
</body>
</html>
