
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REST Countries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1e293b;
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    section {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h1, h2 {
      color: #0f766e;
    }

    input, button {
      padding: 9px;
      margin: 4px 0;
    }

    input {
      width: 65%;
      max-width: 350px;
    }

    button {
      cursor: pointer;
      background: #0f766e;
      color: white;
      border: 0;
      border-radius: 6px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .flag {
      max-width: 180px;
      max-height: 120px;
    }

    .detail {
      border-bottom: 1px solid #eee;
      padding: 8px 0;
    }

    a {
      color: #0f766e;
    }
  </style>
</head>

<body>
  <h1>REST Countries</h1>
  <p>Search for a country to explore its flag, capital and population.</p>

  <section>
    <input
      type="text"
      id="countryInput"
      value="Mongolia"
      placeholder="Enter a country name"
      aria-label="Country name"
    >
    <button id="searchButton" onclick="searchCountry()">Search</button>

    <p id="status" role="status" aria-live="polite">Ready to search.</p>
    <div id="results"></div>
  </section>

  <p><a href="index.html">Back to Week 6</a></p>

  <script>
    async function searchCountry() {
      const name = document.getElementById("countryInput").value.trim();
      const status = document.getElementById("status");
      const output = document.getElementById("results");
      const button = document.getElementById("searchButton");

      output.replaceChildren();

      if (!name) {
        status.textContent = "Please enter a country name.";
        return;
      }

      status.textContent = "Searching...";
      button.disabled = true;

      try {
        let query = name;

        if (
          name.toLowerCase() === "south korea" ||
          name.toLowerCase() === "north korea"
        ) {
          query = "Korea";
        }

        const response = await fetch(
          "https://countries.dev/name/" + encodeURIComponent(query)
        );

        if (!response.ok) {
          throw new Error("Country not found");
        }

        let data = await response.json();

        if (!Array.isArray(data)) {
          data = [data];
        }

        if (name.toLowerCase() === "south korea") {
          data = data.filter(country => country.alpha2Code === "KR");
        } else if (name.toLowerCase() === "north korea") {
          data = data.filter(country => country.alpha2Code === "KP");
        }

        if (data.length === 0) {
          throw new Error("Country not found");
        }

        status.textContent = data.length + " result(s) found.";

        data.forEach(country => {
          const card = document.createElement("section");

          const title = document.createElement("h2");
          title.textContent = country.name || "Unknown country";
          card.appendChild(title);

          const code = country.alpha2Code
            ? country.alpha2Code.toLowerCase()
            : "";

          const flag = document.createElement("img");
          flag.className = "flag";
          flag.alt = (country.name || "Country") + " flag";

          if (country.flags && country.flags.png) {
            flag.src = country.flags.png;
          } else if (country.flags && country.flags.svg) {
            flag.src = country.flags.svg;
          } else if (code) {
            flag.src = "https://countries.dev/flags/" + code + ".svg";
          }

          if (flag.src) {
            card.appendChild(flag);
          }

          const details = [
            ["Capital", country.capital || "Not available"],
            ["Population", country.population != null
              ? country.population.toLocaleString()
              : "Not available"],
            ["Region", country.region || "Not available"],
            ["Area", country.area != null
              ? country.area.toLocaleString() + " km²"
              : "Not available"]
          ];

          details.forEach(([label, value]) => {
            const paragraph = document.createElement("p");
            paragraph.className = "detail";
            paragraph.textContent = label + ": " + value;
            card.appendChild(paragraph);
          });

          output.appendChild(card);
        });

      } catch (error) {
        status.textContent =
          "Sorry, we couldn't find that country or connect to the service. Please try another name.";
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("countryInput").addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          searchCountry();
        }
      }
    );

    searchCountry();
  </script>
</body>
</html>
