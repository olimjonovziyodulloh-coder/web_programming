<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; background: #f4f6f8; }
    main { background: white; padding: 28px; border-radius: 12px; text-align: center; }
    button { padding: 10px 16px; cursor: pointer; background: #3156a5; color: white; border: 0; border-radius: 6px; }
    img { border-radius: 50%; margin-top: 18px; }
    #user { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Random User API</h1>
    <button onclick="getUser()">Generate Random User</button>
    <div id="user">A random profile will appear here.</div>
  </main>
  <script>
    async function getUser() {
      const output = document.getElementById("user");
      output.textContent = "Loading...";
      try {
        const response = await fetch("https://randomuser.me/api/");
        if (!response.ok) throw new Error("Could not load user.");
        const data = await response.json();
        const user = data.results[0];
        output.innerHTML = "";
        const photo = document.createElement("img");
        photo.src = user.picture.large;
        photo.alt = "Random user profile";
        const name = document.createElement("h2");
        name.textContent = user.name.first + " " + user.name.last;
        const email = document.createElement("p");
        email.textContent = "Email: " + user.email;
        const location = document.createElement("p");
        location.textContent = "Location: " + user.location.city + ", " + user.location.country;
        output.append(photo, name, email, location);
      } catch (error) {
        output.textContent = "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
