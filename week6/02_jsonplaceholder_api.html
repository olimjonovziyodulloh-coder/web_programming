<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSONPlaceholder API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f6f8; }
    main { background: white; padding: 25px; border-radius: 12px; }
    button { padding: 10px 15px; cursor: pointer; background: #3156a5; color: white; border: 0; border-radius: 6px; }
    li { margin: 12px 0; }
  </style>
</head>
<body>
  <main>
    <h1>JSONPlaceholder API</h1>
    <p>Load sample posts from a public test API.</p>
    <button onclick="loadPosts()">Load Posts</button>
    <ol id="posts"><li>Posts will appear here.</li></ol>
  </main>
  <script>
    async function loadPosts() {
      const list = document.getElementById("posts");
      list.innerHTML = "<li>Loading...</li>";
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts?_limit=10");
        if (!response.ok) throw new Error("Could not load posts.");
        const posts = await response.json();
        list.innerHTML = "";
        posts.forEach(post => {
          const item = document.createElement("li");
          const title = document.createElement("strong");
          title.textContent = post.title;
          const body = document.createElement("p");
          body.textContent = post.body;
          item.append(title, body);
          list.appendChild(item);
        });
      } catch (error) {
        list.innerHTML = "";
        const item = document.createElement("li");
        item.textContent = "Error: " + error.message;
        list.appendChild(item);
      }
    }
  </script>
</body>
</html>
