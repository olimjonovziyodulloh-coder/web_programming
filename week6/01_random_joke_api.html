
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Fetcher</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f6f8;
            color: #222;
        }

        main {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 14px #0001;
        }

        button {
            padding: 10px 16px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
            background: #3156a5;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #joke {
            margin-top: 20px;
            line-height: 1.6;
        }

        #punchline {
            font-weight: bold;
            margin-top: 10px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 4px solid #ddd;
            border-top: 4px solid #3156a5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        .favorite {
            border-top: 1px solid #ddd;
            padding: 12px 0;
        }

        .favorite p {
            margin: 5px 0;
        }

        h2 {
            margin-top: 28px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Random Joke Fetcher</h1>
        <p>Click the button to get a random joke!</p>

        <button id="loadButton" onclick="getJoke()">Load Joke</button>
        <button id="saveButton" onclick="saveFavorite()" disabled>
            Save Favourite
        </button>

        <div id="spinner" class="spinner hidden" aria-label="Loading"></div>
        <p id="status" role="status" aria-live="polite"></p>

        <div id="joke">
            <p id="setup">Your joke will appear here.</p>
            <p id="punchline"></p>
        </div>

        <h2>Favourite Jokes</h2>
        <div id="favorites">
            <p>No favourite jokes saved yet.</p>
        </div>
    </main>

    <script>
        let currentJoke = null;

        async function getJoke() {
            const loadButton = document.getElementById("loadButton");
            const saveButton = document.getElementById("saveButton");
            const spinner = document.getElementById("spinner");
            const status = document.getElementById("status");
            const setup = document.getElementById("setup");
            const punchline = document.getElementById("punchline");

            loadButton.disabled = true;
            saveButton.disabled = true;
            spinner.classList.remove("hidden");
            status.textContent = "Loading...";
            setup.textContent = "";
            punchline.textContent = "";
            currentJoke = null;

            try {
                const response = await fetch(
                    "https://official-joke-api.appspot.com/random_joke"
                );

                if (!response.ok) {
                    throw new Error("The joke service is unavailable.");
                }

                const data = await response.json();

                currentJoke = {
                    setup: data.setup,
                    punchline: data.punchline
                };

                setup.textContent = data.setup;
                punchline.textContent = data.punchline;
                status.textContent = "Here's your joke!";
                saveButton.disabled = false;
            } catch (error) {
                status.textContent =
                    "Sorry, we couldn't load a joke. Please check your connection and try again.";
            } finally {
                loadButton.disabled = false;
                spinner.classList.add("hidden");
            }
        }

        function saveFavorite() {
            if (!currentJoke) return;

            const favorites = JSON.parse(
                localStorage.getItem("favoriteJokes") || "[]"
            );

            const alreadySaved = favorites.some(
                joke => joke.setup === currentJoke.setup &&
                        joke.punchline === currentJoke.punchline
            );

            if (alreadySaved) {
                document.getElementById("status").textContent =
                    "This joke is already in your favourites.";
                return;
            }

            favorites.push(currentJoke);
            localStorage.setItem("favoriteJokes", JSON.stringify(favorites));

            document.getElementById("status").textContent =
                "Joke saved to your favourites!";

            displayFavorites();
        }

        function displayFavorites() {
            const container = document.getElementById("favorites");
            const favorites = JSON.parse(
                localStorage.getItem("favoriteJokes") || "[]"
            );

            container.innerHTML = "";

            if (favorites.length === 0) {
                container.textContent = "No favourite jokes saved yet.";
                return;
            }

            favorites.forEach(joke => {
                const item = document.createElement("div");
                item.className = "favorite";

                const setup = document.createElement("p");
                setup.textContent = joke.setup;

                const punchline = document.createElement("p");
                punchline.textContent = joke.punchline;

                item.appendChild(setup);
                item.appendChild(punchline);
                container.appendChild(item);
            });
        }

        displayFavorites();
    </script>
</body>
</html>
