<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Basics</title>
</head>
<body>
  <h1>Part 4 - JavaScript Basics</h1>

  <h2>1. Variables and Output</h2>
  <button onclick="showOutput()">Show Output</button>
  <p id="output1"></p>

  <h2>2. Change HTML Elements</h2>
  <p id="original">Original text</p>
  <button onclick="changeText()">Click me</button>

  <h2>3. Read User Input</h2>
  <input type="text" id="userName" placeholder="Your name">
  <button onclick="greet()">Greet</button>
  <p id="output3"></p>

  <h2>4. Conditions (if / else)</h2>
  <input type="number" id="score" placeholder="Enter your score">
  <button onclick="checkGrade()">Check Grade</button>
  <p id="output4"></p>

  <h2>5. Loops</h2>
  <button onclick="runLoops()">Run Loops</button>
  <p id="output5"></p>

  <h2>6. Save Data with localStorage</h2>
  <input type="text" id="username" placeholder="Enter username">
  <button onclick="saveName()">Save Name</button>
  <button onclick="loadName()">Load Name</button>
  <button onclick="deleteName()">Delete Name</button>
  <p id="output6"></p>

  <script>
    // 1. Variables and Output
    function showOutput() {
      let name = "Ziyodulloh";
      let age = 20;
      document.getElementById("output1").textContent =
        "My name is " + name + " and I am " + age + " years old.";
    }

    // 2. Change HTML Elements
    function changeText() {
      document.getElementById("original").textContent =
        "The text has been changed!";
    }

    // 3. Read User Input
    function greet() {
      let name = document.getElementById("userName").value.trim();

      if (name === "") {
        document.getElementById("output3").textContent =
          "Please enter your name.";
      } else {
        document.getElementById("output3").textContent = "Hello, " + name + "!";
      }
    }

    // 4. Conditions (if / else)
    function checkGrade() {
      let score = document.getElementById("score").value;
      let result = document.getElementById("output4");

      if (score === "") {
        result.textContent = "Please enter your score.";
      } else if (Number(score) < 0 || Number(score) > 100) {
        result.textContent = "Enter a score from 0 to 100.";
      } else if (Number(score) >= 90) {
        result.textContent = "Grade: A";
      } else if (Number(score) >= 80) {
        result.textContent = "Grade: B";
      } else if (Number(score) >= 70) {
        result.textContent = "Grade: C";
      } else if (Number(score) >= 60) {
        result.textContent = "Grade: D";
      } else {
        result.textContent = "Grade: F";
      }
    }

    // 5. Loops
    function runLoops() {
      let result = "";

      for (let i = 1; i <= 5; i++) {
        result += i + " ";
      }

      document.getElementById("output5").textContent = result;
    }

    // 6. Save Data with localStorage
    function saveName() {
      let name = document.getElementById("username").value.trim();

      if (name === "") {
        document.getElementById("output6").textContent =
          "Please enter a username.";
        return;
      }

      localStorage.setItem("username", name);
      document.getElementById("output6").textContent = "Name saved successfully!";
    }

    function loadName() {
      let name = localStorage.getItem("username");

      if (name === null) {
        document.getElementById("output6").textContent = "No saved name found.";
      } else {
        document.getElementById("output6").textContent = "Saved username: " + name;
        document.getElementById("username").value = name;
      }
    }

    function deleteName() {
      localStorage.removeItem("username");
      document.getElementById("output6").textContent = "Saved name deleted.";
    }
  </script>
</body>
</html>
