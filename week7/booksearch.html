
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Search</title>

  <style>
    :root {
      --blue: #2563eb;
      --background: #f5f8fc;
      --text: #172b4d;
      --muted: #6380a5;
      --white: #ffffff;
      --border: #e1eaf5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    header {
      padding: 38px 22px 34px;
      background: linear-gradient(120deg, #eaf4ff, #d8eaff 65%, #f5f9ff);
      border-bottom: 1px solid #d7e6f8;
    }

    .hero, main, footer {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--blue);
      color: white;
      font-size: 34px;
      box-shadow: 0 8px 18px #2563eb30;
    }

    h1 {
      margin: 0;
      color: #102b50;
      font-size: clamp(30px, 5vw, 44px);
      letter-spacing: -1px;
    }

    .tagline {
      margin: 8px 0 0;
      color: #50719b;
      font-size: 16px;
    }

    #search-section {
      max-width: 900px;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px 17px;
      border: 1px solid #cbdcf0;
      border-radius: 12px;
      background: white;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #2563eb20;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    main {
      padding: 28px 22px 36px;
    }

    #results-section {
      padding: 26px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 28px #173b7208;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 25px;
      color: #173b72;
    }

    #status {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    #status.error {
      color: #b42318;
    }

    #status.empty {
      color: #925f12;
    }

    #results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 16px;
    }

    .book-card {
      min-width: 0;
      overflow: hidden;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 3px 12px #173b7208;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 9px 20px #173b7215;
    }

    .book-cover, .no-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      display: block;
      object-fit: cover;
      background: #eaf1fa;
    }

    .no-cover {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .card-info {
      padding: 13px;
    }

    .card-info h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .card-info p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .year {
      display: inline-block;
      margin-top: 11px;
      padding: 6px 9px;
      border-radius: 20px;
      background: #edf5ff;
      color: #3469a8;
      font-size: 12px;
    }

    .skeleton {
      aspect-ratio: 2 / 3;
      border-radius: 14px;
      background: #e5edf7;
      animation: loading 1s infinite alternate;
    }

    @keyframes loading {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      border: 2px solid #ffffff70;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      padding: 0 22px 30px;
      text-align: center;
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      header {
        padding: 27px 16px;
      }

      .brand {
        gap: 12px;
        margin-bottom: 22px;
      }

      .brand-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        font-size: 28px;
      }

      .tagline {
        font-size: 14px;
      }

      form {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      main {
        padding: 18px 12px 28px;
      }

      #results-section {
        padding: 18px 13px;
        border-radius: 15px;
      }

      #results-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .card-info {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="hero">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">📚</div>
        <div>
          <h1>Book Search</h1>
          <p class="tagline">
            Discover great books. Search by title or author.
          </p>
        </div>
      </div>

      <section id="search-section">
        <form id="search-form">
          <input
            type="text"
            id="search-input"
            placeholder="Search by title or author..."
            required
            aria-label="Search by title or author"
          >
          <button type="submit" id="search-btn">⌕ Search</button>
        </form>
      </section>
    </div>
  </header>

  <main>
    <section id="results-section">
      <h2>Results</h2>
      <p id="status" aria-live="polite">
        Enter a book title or author to get started.
      </p>
      <div id="results-grid"></div>
    </section>
  </main>

  <footer>
    <a href="../index.html">← Back to Home</a>
  </footer>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');
    const status = document.getElementById('status');
    const grid = document.getElementById('results-grid');
    const button = document.getElementById('search-btn');

    function setStatus(message, type = '') {
      status.textContent = message;
      status.className = type;
    }

    function showLoading() {
      grid.replaceChildren();

      for (let i = 0; i < 8; i++) {
        const card = document.createElement('div');
        card.className = 'skeleton';
        grid.appendChild(card);
      }
    }

    function showBooks(books) {
      grid.replaceChildren();

      for (const book of books) {
        const card = document.createElement('article');
        card.className = 'book-card';

        if (book.cover_i) {
          const cover = document.createElement('img');
          cover.className = 'book-cover';
          cover.src =
            'https://covers.openlibrary.org/b/id/' +
            book.cover_i + '-M.jpg';
          cover.alt = 'Cover of ' + (book.title || 'book');
          cover.loading = 'lazy';

          cover.onerror = function() {
            const placeholder = document.createElement('div');
            placeholder.className = 'no-cover';
            placeholder.textContent = 'No cover available';
            cover.replaceWith(placeholder);
          };

          card.appendChild(cover);
        } else {
          const cover = document.createElement('div');
          cover.className = 'no-cover';
          cover.textContent = 'No cover available';
          card.appendChild(cover);
        }

        const info = document.createElement('div');
        info.className = 'card-info';

        const title = document.createElement('h3');
        title.textContent = book.title || 'Unknown title';

        const author = document.createElement('p');
        author.textContent = book.author_name
          ? book.author_name[0]
          : 'Unknown author';

        const year = document.createElement('span');
        year.className = 'year';
        year.textContent = book.first_publish_year
          ? '▦ ' + book.first_publish_year
          : 'Year unavailable';

        info.appendChild(title);
        info.appendChild(author);
        info.appendChild(year);

        card.appendChild(info);
        grid.appendChild(card);
      }
    }

    async function searchBooks(query) {
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span> Searching';
      setStatus('Searching for "' + query + '"...');
      showLoading();

      try {
        const url =
          'https://openlibrary.org/search.json?q=' +
          encodeURIComponent(query) + '&limit=12';

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error('Request failed');
        }

        const data = await response.json();
        const books = data.docs || [];

        if (books.length === 0) {
          grid.replaceChildren();
          setStatus('No books found. Try another search.', 'empty');
          return;
        }

        showBooks(books);
        setStatus(
          'Showing ' + books.length + ' books for "' + query + '".'
        );
      } catch (error) {
        grid.replaceChildren();
        setStatus(
          'Could not load books. Check your connection and try again.',
          'error'
        );
      } finally {
        button.disabled = false;
        button.textContent = '⌕ Search';
      }
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const query = input.value.trim();

      if (query) {
        searchBooks(query);
      }
    });
  </script>
</body>
</html>
