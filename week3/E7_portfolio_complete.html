<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ziyodulloh - CSS Advanced Portfolio</title>
<style>
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #212529;
    --muted: #6c757d;
    --radius: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #14b8a6;
      --accent: #5eead4;
      --bg: #051a0a;
      --surface: #0b2017;
      --text: #d4edda;
      --muted: #4a9060;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Fixed Navigation */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 40px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  nav span {
    color: var(--primary);
    font-weight: 700;
    font-size: 18px;
  }

  nav a {
    color: var(--muted);
    text-decoration: none;
    margin-left: 20px;
    transition: color 0.3s ease;
  }

  nav a:hover {
    color: var(--primary);
  }

  /* Hero Section with @keyframes */
  @keyframes fadeSlideIn {
    from {
      opacity: 0;
      transform: translateY(28px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hero {
    padding: 140px 40px 80px;
    text-align: center;
    background: linear-gradient(135deg, var(--bg) 0%, var(--accent) 20%);
    margin-top: 56px;
  }

  .hero h1 {
    font-size: 2.5rem;
    color: var(--primary);
    animation: fadeSlideIn 0.8s ease-out forwards;
    margin-bottom: 12px;
  }

  .hero p {
    font-size: 1.1rem;
    color: var(--muted);
    animation: fadeSlideIn 0.8s ease-out 0.2s both;
  }

  /* Skills Section */
  .skills-section {
    padding: 60px 24px;
    max-width: 1000px;
    margin: 0 auto;
  }

  /* Sticky Heading */
  .sticky-h2 {
    position: sticky;
    top: 56px;
    background: var(--bg);
    color: var(--primary);
    font-size: 1.4rem;
    padding: 14px 0 10px;
    border-bottom: 3px solid var(--accent);
    margin-bottom: 20px;
    z-index: 100;
  }

  /* Responsive Grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  @media (min-width: 640px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  /* Cards with ::before Icons */
  .card {
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 24px;
    font-weight: 600;
    background: var(--surface);
    color: var(--text);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 28px rgba(15, 118, 110, 0.18);
  }

  .card[data-icon]::before {
    content: attr(data-icon);
    display: block;
    font-size: 2rem;
    margin-bottom: 10px;
  }

  @media (max-width: 640px) {
    nav {
      padding: 12px 20px;
    }

    nav span {
      font-size: 16px;
    }

    nav a {
      margin-left: 12px;
      font-size: 13px;
    }

    .hero {
      padding: 80px 20px 60px;
    }

    .hero h1 {
      font-size: 1.8rem;
    }

    .sticky-h2 {
      font-size: 1.2rem;
    }

    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <nav>
    <span>Ziyodulloh</span>
    <div><a href="#home">Home</a><a href="#skills">Skills</a></div>
  </nav>

  <section class="hero" id="home">
    <h1>Hello, I am Ziyodulloh</h1>
    <p>International Student · Gachon University · English Track · Web Programming</p>
  </section>

  <section class="skills-section" id="skills">
    <h2 class="sticky-h2">My Skills</h2>
    <div class="grid">
      <div class="card" data-icon="🌐">HTML5</div>
      <div class="card" data-icon="🎨">CSS3 Advanced</div>
      <div class="card" data-icon="⚡">JavaScript</div>
      <div class="card" data-icon="📱">Responsive</div>
      <div class="card" data-icon="🔧">Web Tools</div>
      <div class="card" data-icon="🌍">Multilingual</div>
    </div>
  </section>
</body>
</html>
