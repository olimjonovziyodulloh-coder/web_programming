<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #0f766e;
    border-radius: 12px;
    position: relative;
    margin: 40px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #0f766e;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 6px 14px;
    border-radius: 20px;
  }
  .card p {
    padding: 16px;
    color: #212529;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <p>Card content here</p>
  </div>
</body>
</html>
