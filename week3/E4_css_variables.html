<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f8f9fa;
    --text: #212529;
    --radius: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #14b8a6;
      --accent: #5eead4;
      --bg: #051a0a;
      --text: #d4edda;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    padding: 20px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: var(--radius);
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .btn:hover {
    background: var(--accent);
  }

  .card {
    background: var(--bg);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 16px;
    color: var(--text);
  }
</style>
</head>
<body>
  <button class="btn">Click Me</button>
  <div class="card">A themed card using CSS variables</div>
</body>
</html>
